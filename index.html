<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>三麻ログPWA</title>
  <meta name="theme-color" content="#FDFF00" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="三麻ログ" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.json?v=2.3.0" />
  <link rel="apple-touch-icon" href="./sanma_v140_apple_touch_icon.png?v=2.3.0" />
  <link rel="icon" type="image/png" sizes="192x192" href="./sanma_v140_icon_192.png?v=2.3.0" />
  <link rel="icon" type="image/png" sizes="512x512" href="./sanma_v140_icon_512.png?v=2.3.0" />
  <link rel="shortcut icon" href="./sanma_v140_favicon.png?v=2.3.0" />

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #d1d5db;
      --primary: #111827;
      --primaryText: #ffffff;
      --accent: #FDFF00;
      --danger: #b91c1c;
      --ok: #047857;
      --soft: #f3f4f6;
      --safe-bottom: env(safe-area-inset-bottom);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      padding: 12px 14px;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: .02em;
    }
    header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    main { padding: 14px; max-width: 900px; margin: 0 auto 64px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    h2 { font-size: 18px; margin: 0 0 10px; }
    h3 { font-size: 15px; margin: 14px 0 8px; }
    .grid { display: grid; gap: 10px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    @media (max-width: 520px) {
      .grid.two, .grid.three, .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: 650;
      min-height: 48px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button.primary { background: var(--primary); color: var(--primaryText); border-color: var(--primary); }
    button.accent { background: var(--accent); color: #111827; border-color: #d4b900; }
    button.danger { background: #fee2e2; color: var(--danger); border-color: #fecaca; }
    button.ok { background: #d1fae5; color: var(--ok); border-color: #a7f3d0; }
    button.soft { background: var(--soft); }
    button.selected { background: var(--primary); color: var(--primaryText); border-color: var(--primary); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pill {
      display: inline-block;
      padding: 5px 9px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      margin: 2px;
    }
    .pill.black { background: #111827; color: white; border-color: #111827; }
    .pill.yellow { background: #fff8a6; border-color: #e8d400; }
    .muted { color: var(--muted); font-size: 13px; }
    .big-number { font-size: 30px; font-weight: 800; margin: 8px 0; }
    .score-pos { color: var(--ok); }
    .score-neg { color: var(--danger); }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      background: white;
    }
    textarea { min-height: 80px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-weight: 700; background: #fafafa; }
    .notice { padding: 10px; border-radius: 12px; background: #fffbeb; border: 1px solid #fde68a; }
    .dangerBox { padding: 10px; border-radius: 12px; background: #fef2f2; border: 1px solid #fecaca; }
    .footerNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      box-shadow: 0 -2px 10px rgba(0,0,0,.06);
    }
    .footerNav button {
      min-height: 46px;
      padding: 7px 4px;
      font-size: 12px;
      border-radius: 12px;
      line-height: 1.15;
      width: 100%;
    }

    .versionBox { padding: 12px; border-radius: 12px; background: #f9fafb; border: 1px solid var(--line); font-size: 14px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    .tableView {
      position: relative;
      min-height: 250px;
      margin: 14px 0 4px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at center, rgba(253,255,0,.38), rgba(255,255,255,.92) 55%, rgba(249,250,251,1) 100%);
    }
    .tableCore {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 96px;
      height: 96px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: #111827;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      letter-spacing: .04em;
      box-shadow: 0 8px 20px rgba(0,0,0,.18);
    }
    .seatBox {
      position: absolute;
      min-width: 118px;
      max-width: 150px;
      padding: 9px 10px;
      border-radius: 14px;
      background: #fff;
      border: 2px solid var(--line);
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
      text-align: center;
      font-size: 13px;
    }
    .seatTop { left: 50%; top: 12px; transform: translateX(-50%); }
    .seatBottom { left: 50%; bottom: 12px; transform: translateX(-50%); }
    .seatLeft { left: 12px; top: 50%; transform: translateY(-50%); }
    .seatRight { right: 12px; top: 50%; transform: translateY(-50%); }
    .seatName { font-size: 18px; font-weight: 800; margin-bottom: 3px; }
    .seatRole { color: var(--muted); font-size: 12px; }
    .seatTags { margin-top: 5px; display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
    .seatTag {
      font-size: 11px;
      border-radius: 999px;
      padding: 2px 7px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    .seatDealer { border-color: #111827; }
    .seatMasuda { border-color: #FDFF00; box-shadow: 0 0 0 3px rgba(253,255,0,.65), 0 4px 12px rgba(0,0,0,.10); }
    .seatNorth { opacity: .72; background: #f3f4f6; }
    .tagDealer { background: #111827; color: #fff; border-color: #111827; }
    .tagNorth { background: #e5e7eb; color: #374151; }
    .tagMasuda { background: #FDFF00; color: #111827; border-color: #111827; }
    @media (max-width: 430px) {
      .tableView { min-height: 285px; padding: 10px; }
      .seatBox { min-width: 104px; max-width: 128px; padding: 8px 7px; font-size: 12px; }
      .seatName { font-size: 16px; }
      .tableCore { width: 78px; height: 78px; font-size: 13px; }
      .seatLeft { left: 6px; }
      .seatRight { right: 6px; }
    }


    .compactTableCard { margin: 10px 0; }
    .compactTableCard .tableView { min-height: 220px; margin: 8px 0 0; }
    .statusWarn { padding: 10px 12px; border-radius: 12px; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; margin: 10px 0; }
    .statusOk { padding: 10px 12px; border-radius: 12px; background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; margin: 10px 0; }
    .buttonNote { color: var(--muted); font-size: 12px; margin-top: 6px; }


    .updateBox { padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: #f9fafb; margin: 10px 0; }
    .updateBox strong { display: inline-block; min-width: 110px; }


    .resumeBlock { padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: #fff; margin: 10px 0; }
    .resumeBlock ul { margin: 8px 0 0 20px; padding: 0; }
    .resumeBlock li { margin: 5px 0; }


    .pointDisabled {
      background: #e5e7eb !important;
      color: #9ca3af !important;
      border-color: #d1d5db !important;
      cursor: not-allowed !important;
      opacity: .72;
    }
    .pointHelp {
      font-size: 12px;
      color: var(--muted);
      margin: 6px 0 8px;
    }


    /* v2.3.0: エケベリア管理アプリ寄せのアプリシェル */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .appShell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(246,247,249,.94);
      backdrop-filter: blur(10px);
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(209,213,219,.72);
      text-align: left;
    }
    header h1 {
      font-size: 22px;
      margin: 0;
      font-weight: 850;
      line-height: 1.2;
    }
    header .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 3px;
    }
    main {
      flex: 1;
      padding: 0 14px 92px;
      max-width: none;
      margin: 0;
      width: 100%;
    }
    .footerNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      max-width: 520px;
      height: 78px;
      padding: 0 0 var(--safe-bottom);
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0;
      box-shadow: none;
      z-index: 20;
    }
    .footerNav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      min-height: auto;
      height: 78px;
      padding: 7px 2px calc(7px + var(--safe-bottom));
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #6b7280;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
      width: 100%;
      box-shadow: none;
    }
    .footerNav button::first-line {
      font-size: 20px;
    }
    .footerNav button:active,
    .footerNav button:hover {
      background: rgba(253,255,0,.18);
      color: #111827;
    }
    .card {
      border-radius: 18px;
      margin: 12px 0;
      padding: 14px;
    }

  </style>
</head>
<body>
<div class="appShell">
<header>
    <h1>三麻ログPWA <span style="font-size:12px;color:#6b7280;">v2.3.0</span></h1>
    <div class="sub">四人一抜け三麻・益田視点ログ</div>
  </header>
  <main id="app"></main>
  <nav class="footerNav">
    <button onclick="showHome()"><span style="font-size:20px">🏠</span><span>ホーム</span></button>
    <button onclick="showCurrentOrNew()"><span style="font-size:20px">🀄</span><span>進行中</span></button>
    <button onclick="showCsv()"><span style="font-size:20px">📄</span><span>CSV</span></button>
    <button onclick="showAppUpdate()"><span style="font-size:20px">↻</span><span>更新</span></button>
    <button onclick="showSystem()"><span style="font-size:20px">⚙️</span><span>設定</span></button>
  </nav>

<script>
(() => {
  const APP_VERSION = "2.3.0";
  const DATA_SCHEMA_VERSION = 3;
  const KEY_SETTINGS = "sanma_log_pwa_settings";
  const KEY_BACKUP_PREFIX = "sanma_log_pwa_backup_before_migration_";
  const MEMBERS = ["益田", "水戸", "渋谷", "松林"];
  const POINTS = [1000,2000,3000,4000,6000,8000,9000,12000,16000,18000,24000,32000,36000,48000,64000,96000];
  const STANCES = ["全ツッパ", "押し気味", "回し気味", "ベタ降り", "不明"];
  const TAGS = {
    win: ["4000拾い", "高打点成功", "親活用", "親流し成功", "ミスなし", "不明"],
    dealIn: ["押しすぎ", "降り遅れ", "高打点放銃", "不明"],
    tsumoLoss: ["高打点被ツモ", "ミスなし", "不明"],
    draw: ["形式テンパイ成功", "オリ切り", "押しすぎ", "不明"]
  };
  const KEY_SESSIONS = "sanma_log_pwa_sessions";
  const KEY_LOGS = "sanma_log_pwa_round_logs";
  const KEY_DRAFT = "sanma_log_pwa_draft";

  const app = document.getElementById("app");
  let seatDraft = { east: "", south: "", west: "", north: "" };
  let inputDraft = {};

  function load(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) ?? fallback; }
    catch { return fallback; }
  }
  function save(key, value) { localStorage.setItem(key, JSON.stringify(value)); }
  function sessions() { return load(KEY_SESSIONS, []); }
  function logs() { return load(KEY_LOGS, []); }
  function setSessions(v) { save(KEY_SESSIONS, v); }
  function setLogs(v) { save(KEY_LOGS, v); }

  function settings() { return load(KEY_SETTINGS, {}); }
  function setSettings(v) { save(KEY_SETTINGS, v); }
  function hasSchemaUpdateNeeded() {
    const st = settings();
    return st.dataSchemaVersion !== DATA_SCHEMA_VERSION;
  }
  function schemaStatusHtml() {
    if (hasSchemaUpdateNeeded()) {
      return `<div class="statusWarn"><strong>保存データ形式補正推奨</strong><br>システム画面から「保存データ形式を現在形式に補正」を一度実行してください。既存データは削除せず、実行前に自動バックアップを作成します。</div>`;
    }
    return `<div class="statusOk">データ形式：最新版です。</div>`;
  }

  function safeArray(v) { return Array.isArray(v) ? v : []; }

  function normalizeSession(s) {
    const seats = safeArray(s?.seats);
    const initial = s?.initialSeats || {};
    const fallbackSeats = seats.length === 4 ? seats : [
      initial.east || "",
      initial.south || "",
      initial.west || "",
      initial.north || ""
    ];
    const ns = {
      id: s?.id || id("H"),
      date: s?.date || today(),
      seats: fallbackSeats,
      initialSeats: {
        east: initial.east || fallbackSeats[0] || "",
        south: initial.south || fallbackSeats[1] || "",
        west: initial.west || fallbackSeats[2] || "",
        north: initial.north || fallbackSeats[3] || ""
      },
      current: {
        field: s?.current?.field || "東場",
        roundNumber: Number(s?.current?.roundNumber ?? 1),
        repeatCount: Number(s?.current?.repeatCount ?? 0),
        dealerIndex: Number(s?.current?.dealerIndex ?? 0)
      },
      masudaScorePoint: s?.masudaScorePoint ?? (s?.masudaScoreK == null ? null : Number(s.masudaScoreK) * 1000),
      masudaScoreK: s?.masudaScoreK ?? (s?.masudaScorePoint == null ? null : Math.round(Number(s.masudaScorePoint) / 1000)),
      memo: s?.memo ?? "",
      status: s?.status || "completed",
      createdAt: s?.createdAt || nowText(),
      updatedAt: s?.updatedAt || nowText(),
      appVersion: APP_VERSION,
      schemaVersion: DATA_SCHEMA_VERSION
    };
    ns.sessionNo = Number(s?.sessionNo || 0) || null;
    ns.sessionLabel = s?.sessionLabel || "";
    return { ...s, ...ns, initialSeats: ns.initialSeats, current: ns.current, seats: ns.seats, sessionNo: ns.sessionNo, sessionLabel: ns.sessionLabel };
  }

  function normalizeLog(l) {
    const point = Number(l?.scoreDeltaPoint ?? 0);
    const nl = {
      id: l?.id || id("L"),
      sessionId: l?.sessionId || "",
      date: l?.date || today(),
      roundLabel: l?.roundLabel || "",
      field: l?.field || "",
      roundNumber: Number(l?.roundNumber ?? 0),
      repeatCount: Number(l?.repeatCount ?? 0),
      dealer: l?.dealer || "",
      northPlayer: l?.northPlayer || "",
      participants: safeArray(l?.participants),
      masudaJoined: Boolean(l?.masudaJoined),
      skipReason: l?.skipReason || "",
      resultType: l?.resultType || "",
      opponent: l?.opponent || "",
      scoreDeltaPoint: point,
      scoreDeltaK: l?.scoreDeltaK ?? Math.round(point / 1000),
      masudaDealer: Boolean(l?.masudaDealer),
      opponentDealer: Boolean(l?.opponentDealer),
      stance: l?.stance || "",
      subjectiveTag: l?.subjectiveTag || "",
      tenpaiPlayers: safeArray(l?.tenpaiPlayers),
      createdAt: l?.createdAt || nowText(),
      appVersion: APP_VERSION,
      schemaVersion: DATA_SCHEMA_VERSION
    };
    return { ...l, ...nl };
  }

  function createMigrationBackup() {
    const backup = {
      createdAt: nowText(),
      appVersion: APP_VERSION,
      dataSchemaVersion: DATA_SCHEMA_VERSION,
      sessions: sessions(),
      logs: logs(),
      settings: settings()
    };
    const key = KEY_BACKUP_PREFIX + new Date().toISOString().replace(/[:.]/g, "-");
    save(key, backup);
    return key;
  }

  function migrateData({silent=false} = {}) {
    const beforeSessions = sessions();
    const beforeLogs = logs();
    const beforeSettings = settings();

    if (!silent) createMigrationBackup();

    const normalizedSessions = assignMissingSessionNumbers(safeArray(beforeSessions).map(normalizeSession));
    const normalizedLogs = safeArray(beforeLogs).map(normalizeLog);

    setSessions(normalizedSessions);
    setLogs(normalizedLogs);
    setSettings({
      ...beforeSettings,
      appVersion: APP_VERSION,
      dataSchemaVersion: DATA_SCHEMA_VERSION,
      lastMigrationAt: nowText(),
      migrationCount: Number(beforeSettings.migrationCount || 0) + (silent ? 0 : 1)
    });

    return {
      sessionsBefore: safeArray(beforeSessions).length,
      sessionsAfter: normalizedSessions.length,
      logsBefore: safeArray(beforeLogs).length,
      logsAfter: normalizedLogs.length
    };
  }

  function ensureCurrentSchema() {
    // v1.8.0以降、自動マイグレーションは行わない。
    // データ形式更新は、システム画面の手動ボタンから実行する。
    return;
  }

  function id(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function today() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function nowText() {
    const d = new Date();
    const pad = n => String(n).padStart(2,"0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  function makeSessionLabel(date, no) {
    return `${date} ${no}回目`;
  }
  function createdSortValue(s) {
    return `${s?.date || ""} ${s?.createdAt || ""} ${s?.id || ""}`;
  }
  function nextSessionNoForDate(date) {
    const nums = sessions()
      .filter(s => s.date === date)
      .map(s => Number(s.sessionNo || 0))
      .filter(n => Number.isFinite(n) && n > 0);
    return nums.length ? Math.max(...nums) + 1 : 1;
  }
  function assignMissingSessionNumbers(list) {
    const grouped = {};
    list.forEach((s) => {
      const d = s?.date || today();
      if (!grouped[d]) grouped[d] = [];
      grouped[d].push(s);
    });
    Object.keys(grouped).forEach(date => {
      const group = grouped[date].sort((a,b) => createdSortValue(a).localeCompare(createdSortValue(b)));
      const used = new Set(group.map(s => Number(s.sessionNo || 0)).filter(n => Number.isFinite(n) && n > 0));
      let next = 1;
      group.forEach((s) => {
        if (!s.sessionNo) {
          while (used.has(next)) next++;
          s.sessionNo = next;
          used.add(next);
        }
        if (!s.sessionLabel) s.sessionLabel = makeSessionLabel(date, s.sessionNo);
      });
    });
    return list;
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
  }
  function activeSession() { return sessions().find(s => s.status === "in_progress") || null; }
  function updateSession(session) {
    const all = sessions();
    const idx = all.findIndex(s => s.id === session.id);
    session.updatedAt = nowText();
    if (idx >= 0) all[idx] = session; else all.push(session);
    setSessions(all);
  }
  function addLog(log) {
    const all = logs();
    all.push(log);
    setLogs(all);
  }
  function activeLogsForSession(sessionId) {
    return logs()
      .filter(l => l.sessionId === sessionId && l.isCanceled !== true)
      .sort((a,b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
  }
  function lastActiveLog(sessionId) {
    const ls = activeLogsForSession(sessionId);
    return ls.length ? ls[ls.length - 1] : null;
  }
  function formatDelta(point) {
    const n = Number(point || 0);
    return n > 0 ? `+${n}点` : `${n}点`;
  }
  function summarizeLog(l) {
    if (!l) return `<div class="previousLog"><div class="title">前回結果</div><div class="body muted">この半荘の前回ログはまだありません。</div></div>`;
    const detail = [
      l.opponent ? esc(l.opponent) : "",
      Number(l.scoreDeltaPoint || 0) !== 0 ? formatDelta(l.scoreDeltaPoint) : "0点",
      l.stance ? `姿勢：${esc(l.stance)}` : "",
      l.subjectiveTag ? `タグ：${esc(l.subjectiveTag)}` : "",
      l.tenpaiPlayers && l.tenpaiPlayers.length ? `テンパイ：${esc(l.tenpaiPlayers.join("・"))}` : ""
    ].filter(Boolean).join(" / ");
    return `<div class="previousLog">
      <div class="title">前回結果</div>
      <div class="body"><strong>${esc(l.roundLabel || "")}</strong>　${esc(l.resultType || "")}${detail ? "　" + detail : ""}</div>
      <div class="meta">作成：${esc(l.createdAt || "")}</div>
    </div>`;
  }
  function renderCurrentStatus(session) {
    const r = currentRoles(session);
    return `<div class="currentStatus">
      <div class="big">現在入力中：${esc(roundLabel(session))}</div>
      <div class="small">親：${esc(r.east)}　北家：${esc(r.north)}（抜け番）　益田：${esc(masudaRole(session))}</div>
    </div>`;
  }
  function currentRoles(session) {
    const seats = session.seats;
    const di = session.current.dealerIndex;
    return {
      east: seats[di % 4],
      south: seats[(di + 1) % 4],
      west: seats[(di + 2) % 4],
      north: seats[(di + 3) % 4]
    };
  }
  function participants(session) {
    const r = currentRoles(session);
    return [r.east, r.south, r.west].filter(Boolean);
  }
  function roundLabel(session) {
    const f = session.current.field === "東場" ? "東" : "南";
    const base = `${f}${session.current.roundNumber}局`;
    return session.current.repeatCount > 0 ? `${base} ${session.current.repeatCount}連荘` : base;
  }
  function masudaRole(session) {
    const r = currentRoles(session);
    if (r.east === "益田") return "東家（親）";
    if (r.south === "益田") return "南家";
    if (r.west === "益田") return "西家";
    if (r.north === "益田") return "北家（抜け番）";
    return "";
  }
  function roleLabel(roleKey) {
    return ({ east: "東家", south: "南家", west: "西家", north: "北家" }[roleKey] || "");
  }
  function roleShort(roleKey) {
    return ({ east: "東", south: "南", west: "西", north: "北" }[roleKey] || "");
  }
  function playerRoleMap(session) {
    const r = currentRoles(session);
    return [
      { role: "east", name: r.east },
      { role: "south", name: r.south },
      { role: "west", name: r.west },
      { role: "north", name: r.north }
    ];
  }
  function renderSeatBox(posClass, item) {
    const isDealer = item.role === "east";
    const isNorth = item.role === "north";
    const isMasuda = item.name === "益田";
    const cls = ["seatBox", posClass, isDealer ? "seatDealer" : "", isNorth ? "seatNorth" : "", isMasuda ? "seatMasuda" : ""].join(" ");
    const tags = [
      isMasuda ? `<span class="seatTag tagMasuda">益田</span>` : "",
      isDealer ? `<span class="seatTag tagDealer">親</span>` : "",
      isNorth ? `<span class="seatTag tagNorth">抜け番</span>` : ""
    ].filter(Boolean).join("");
    return `<div class="${cls}">
      <div class="seatName">${esc(item.name || "-")}</div>
      <div class="seatRole">${esc(roleLabel(item.role))}</div>
      <div class="seatTags">${tags}</div>
    </div>`;
  }
  function renderTableView(session, compact=false) {
    const items = playerRoleMap(session);
    const order = ["east", "south", "west", "north"];
    const masudaItem = items.find(x => x.name === "益田") || items[0];
    const idx = order.indexOf(masudaItem.role);
    const byRole = Object.fromEntries(items.map(x => [x.role, x]));

    // 益田を常に下に固定。右＝次家、上＝対面、左＝上家の位置で表示。
    const bottom = byRole[order[idx]];
    const right = byRole[order[(idx + 1) % 4]];
    const top = byRole[order[(idx + 2) % 4]];
    const left = byRole[order[(idx + 3) % 4]];

    const sectionClass = compact ? "card compactTableCard" : "card";
    const title = compact ? "卓図" : "卓図（益田視点）";
    const note = compact ? "" : `<p class="muted">益田を常に下側に固定して表示します。実際の東南西北は各名前の下に表示します。</p>`;
    return `<section class="${sectionClass}">
      <h2>${title}</h2>
      ${note}
      <div class="tableView">
        ${renderSeatBox("seatTop", top)}
        ${renderSeatBox("seatLeft", left)}
        <div class="tableCore">${esc(roundLabel(session)).replace(" ", "<br>")}</div>
        ${renderSeatBox("seatRight", right)}
        ${renderSeatBox("seatBottom", bottom)}
      </div>
    </section>`;
  }
  function isMasudaDealer(session) { return currentRoles(session).east === "益田"; }
  function opponentOptions(session) { return participants(session).filter(p => p !== "益田"); }
  function baseLog(session, resultType) {
    const r = currentRoles(session);
    return {
      id: id("L"),
      sessionId: session.id,
      date: session.date,
      roundLabel: roundLabel(session),
      field: session.current.field,
      roundNumber: session.current.roundNumber,
      repeatCount: session.current.repeatCount,
      dealer: r.east,
      northPlayer: r.north,
      participants: participants(session),
      masudaJoined: r.north !== "益田",
      skipReason: "",
      resultType,
      opponent: "",
      scoreDeltaPoint: 0,
      scoreDeltaK: 0,
      masudaDealer: r.east === "益田",
      opponentDealer: false,
      stance: "",
      subjectiveTag: "",
      tenpaiPlayers: [],
      createdAt: nowText()
    };
  }

  function btn(label, onclick, cls="", disabled=false) {
    return `<button class="${cls}" onclick="${onclick}" ${disabled ? "disabled" : ""}>${esc(label)}</button>`;
  }
  function pointSet(type) {
    const sets = {
      childWin: [1000,2000,4000,8000,12000,16000,24000,32000,64000,96000],
      parentWin: [1000,3000,6000,12000,18000,24000,36000,48000,96000],
      parentTsumoLossPay: [1000,2000,3000,6000,9000,12000,18000,24000,48000],
      childTsumoLossPay: [1000,2000,4000,6000,8000,12000,16000,32000,48000]
    };
    return sets[type] || POINTS;
  }
  function allowedPointsForCurrentInput(session) {
    const result = inputDraft.resultType;
    const r = currentRoles(session);
    const masudaDealer = r.east === "益田";

    if (result === "ロン和了" || result === "ツモ和了") {
      return pointSet(masudaDealer ? "parentWin" : "childWin");
    }

    if (result === "ロン放銃") {
      if (!inputDraft.opponent) return [];
      const opponentDealer = r.east === inputDraft.opponent;
      return pointSet(opponentDealer ? "parentWin" : "childWin");
    }

    if (result === "ツモられ") {
      if (!inputDraft.opponent) return [];
      const opponentDealer = r.east === inputDraft.opponent;
      return pointSet(opponentDealer ? "parentTsumoLossPay" : "childTsumoLossPay");
    }

    return POINTS;
  }
  function isPointAllowed(session, point) {
    if (inputDraft.isIrregularPoint) return true;
    return allowedPointsForCurrentInput(session).includes(Number(point));
  }
  function renderPointButtons(varName="point", session=null) {
    const allowed = session ? allowedPointsForCurrentInput(session) : POINTS;
    const needsOpponent = ["ロン放銃", "ツモられ"].includes(inputDraft.resultType);
    const help = needsOpponent && !inputDraft.opponent
      ? `<div class="pointHelp">先に相手を選ぶと、使える点数だけ押せるようになります。</div>`
      : `<div class="pointHelp">この局面で使わない点数は灰色で表示し、選択できません。</div>`;
    const buttons = POINTS.map(p => {
      const disabled = !allowed.includes(p);
      const cls = inputDraft[varName] === p ? "selected" : disabled ? "pointDisabled" : "";
      return btn(`${p}点`, `selectPoint(${p})`, cls, disabled);
    }).join("");
    const irregular = inputDraft.isIrregularPoint
      ? `<div class="notice">イレギュラー点数：<strong>${inputDraft.point}点</strong></div>`
      : "";
    return `${help}<div class="grid three">${buttons}</div><div class="row" style="margin-top:8px;">${btn("イレギュラー入力", "selectIrregularPoint()", "soft")}${inputDraft.isIrregularPoint ? btn("通常点数に戻す", "clearIrregularPoint()") : ""}</div>${irregular}`;
  }
  function renderChoiceButtons(list, fnName, current="") {
    return `<div class="grid three">${list.map(x => btn(x, `${fnName}('${x}')`, current === x ? "selected" : "")).join("")}</div>`;
  }

  window.showHome = function() {
    const active = activeSession();
    const ss = sessions();
    const ls = logs();
    app.innerHTML = `
      <section class="card">
        <h2>ホーム</h2>
        <p class="muted">局ごとに、益田視点の結果・点数移動・対局姿勢を記録します。</p>
        <div class="grid two">
          ${btn("新しい半荘", "showNewSession()", "primary")}
          ${btn(active ? "進行中の半荘" : "進行中なし", "showCurrentOrNew()", active ? "accent" : "soft")}
          ${btn("半荘一覧", "showSessionList()")}
          ${btn("局ログ一覧", "showLogList()")}
          ${btn("CSV出力", "showCsv()")}
          ${btn("アプリ更新", "showAppUpdate()")}
          ${btn("システム", "showSystem()")}
        </div>
      </section>
      <section class="card">
        <h2>現在の状況</h2>
        ${active ? `<p><span class="pill black">進行中</span> ${esc(active.sessionLabel || active.date)} / ${esc(roundLabel(active))}</p><p>親：${esc(currentRoles(active).east)}　北家：${esc(currentRoles(active).north)}</p>` : `<p class="muted">進行中の半荘はありません。</p>`}
        <p class="muted">半荘数：${ss.length} / 局ログ数：${ls.length}</p>
      </section>
    `;
  };

  window.showCurrentOrNew = function() {
    const active = activeSession();
    if (active) showRound(active.id); else showNewSession();
  };

  window.showNewSession = function() {
    if (activeSession()) {
      app.innerHTML = `<section class="card"><h2>進行中の半荘があります</h2><p>新しい半荘を開始する前に、進行中の半荘を終了してください。</p>${btn("進行中へ", "showCurrentOrNew()", "primary")}</section>`;
      return;
    }
    seatDraft = { east: "", south: "", west: "", north: "" };
    renderSeatSetup();
  };

  window.setSeat = function(pos, name) {
    seatDraft[pos] = name;
    if (pos === "east") { seatDraft.south = ""; seatDraft.west = ""; seatDraft.north = ""; }
    if (pos === "south") { seatDraft.west = ""; seatDraft.north = ""; }
    if (pos === "west") { seatDraft.north = ""; }
    const chosen = [seatDraft.east, seatDraft.south, seatDraft.west].filter(Boolean);
    if (seatDraft.east && seatDraft.south && seatDraft.west) {
      seatDraft.north = MEMBERS.find(m => !chosen.includes(m)) || "";
    }
    renderSeatSetup();
  };

  function renderSeatButtons(pos, used) {
    return `<div class="grid four">${MEMBERS.filter(m => !used.includes(m) || seatDraft[pos] === m).map(m => btn(m, `setSeat('${pos}','${m}')`, seatDraft[pos] === m ? "selected" : "")).join("")}</div>`;
  }
  function renderSeatSetup() {
    const usedEast = [];
    const usedSouth = [seatDraft.east].filter(Boolean);
    const usedWest = [seatDraft.east, seatDraft.south].filter(Boolean);
    const ready = seatDraft.east && seatDraft.south && seatDraft.west && seatDraft.north;
    app.innerHTML = `
      <section class="card">
        <h2>半荘開始・席順設定</h2>
        <h3>東家を選択</h3>${renderSeatButtons("east", usedEast)}
        <h3>南家を選択</h3>${seatDraft.east ? renderSeatButtons("south", usedSouth) : `<p class="muted">先に東家を選択してください。</p>`}
        <h3>西家を選択</h3>${seatDraft.south ? renderSeatButtons("west", usedWest) : `<p class="muted">先に南家を選択してください。</p>`}
        <h3>北家</h3><p>${seatDraft.north ? `<span class="pill yellow">${esc(seatDraft.north)}</span>` : `<span class="muted">東・南・西を選ぶと自動表示されます。</span>`}</p>
        <div class="row">${btn("半荘開始", "startSession()", ready ? "primary" : "",)} ${btn("ホーム", "showHome()")}</div>
      </section>`;
    if (!ready) {
      const buttons = app.querySelectorAll("button");
      const start = Array.from(buttons).find(b => b.textContent === "半荘開始");
      if (start) start.disabled = true;

  window.startSession = function() {
    if (!(seatDraft.east && seatDraft.south && seatDraft.west && seatDraft.north)) return;
    const sessionDate = today();
    const sessionNo = nextSessionNoForDate(sessionDate);
    const session = {
      id: id("H"),
      date: sessionDate,
      sessionNo,
      sessionLabel: makeSessionLabel(sessionDate, sessionNo),
      seats: [seatDraft.east, seatDraft.south, seatDraft.west, seatDraft.north],
      initialSeats: { east: seatDraft.east, south: seatDraft.south, west: seatDraft.west, north: seatDraft.north },
      current: { field: "東場", roundNumber: 1, repeatCount: 0, dealerIndex: 0 },
      masudaScorePoint: null,
      masudaScoreK: null,
      memo: "",
      status: "in_progress",
      createdAt: nowText(),
      updatedAt: nowText()
    };
    const all = sessions(); all.push(session); setSessions(all);
    showRound(session.id);
  };

  window.showRound = function(sessionId) {
    const session = sessions().find(s => s.id === sessionId);

    const ps = participants(session);
    const masudaJoined = r.north !== "益田";
    app.innerHTML = `
      <section class="card">
        ${renderCurrentStatus(session)}
        <p class="muted">${esc(session.sessionLabel || session.date)}</p>

        </div>

      <section class="card">

          ${btn("半荘を終了", `finishSession('${session.id}')`, "danger")}

      </section>

  function renderMasudaAbsent(session) {

      <div class="grid two">

        ${btn("ツモられ", `startInput('${session.id}','ツモられ')`, "danger")}

  window.startInput = function(sessionId, resultType) {
    inputDraft = { sessionId, resultType, opponent: "", point: null, isIrregularPoint: false, stance: "", tag: "", tenpaiPlayers: [] };
    renderInputForm();

  window.selectOpponent = function(name) {

  window.selectPoint = function(point) {

    inputDraft.point = point;
    inputDraft.isIrregularPoint = false;
    renderInputForm();
  };
  window.selectIrregularPoint = function() {
    const raw = prompt("イレギュラー点数を入力してください。例：72000");
    if (raw == null) return;
    const n = Number(String(raw).replace(/[^0-9]/g, ""));
    if (!Number.isFinite(n) || n <= 0 || n % 1000 !== 0) {
      alert("1000点単位の正の数で入力してください。");
      return;
    }
    inputDraft.point = n;
    inputDraft.isIrregularPoint = true;
    renderInputForm();
  };
  window.clearIrregularPoint = function() {
    inputDraft.point = null;
    inputDraft.isIrregularPoint = false;
    renderInputForm();
  };

  window.selectTag = function(tag) { inputDraft.tag = tag; renderInputForm(); };
  window.toggleTenpai = function(name) {
    const arr = inputDraft.tenpaiPlayers || [];
    if (arr.includes(name)) inputDraft.tenpaiPlayers = arr.filter(x => x !== name);
    else inputDraft.tenpaiPlayers = [...arr, name];
    renderInputForm();
  };

  function tagListFor(resultType) {
    if (resultType === "ロン和了" || resultType === "ツモ和了") return TAGS.win;
    if (resultType === "ロン放銃") return TAGS.dealIn;
    if (resultType === "ツモられ") return TAGS.tsumoLoss;
    if (resultType === "流局") return TAGS.draw;
    return ["不明"];
  }

  function renderInputForm() {
    const session = sessions().find(s => s.id === inputDraft.sessionId);
    if (!session) return showHome();
    const result = inputDraft.resultType;
    const others = opponentOptions(session);
    const ps = participants(session);
    const needsOpponent = ["ロン和了", "ロン放銃", "ツモられ"].includes(result);
    const isDraw = result === "流局";
    let scorePreview = "";
    if (isDraw) scorePreview = `<div class="notice">益田の点数移動：<strong>${calcDrawDelta(inputDraft.tenpaiPlayers, ps)}点</strong></div>`;
    else if (inputDraft.point) {
      const sign = (result === "ロン放銃" || result === "ツモられ") ? -1 : 1;
      const val = sign * inputDraft.point;
      scorePreview = `<div class="notice">点数移動：<strong>${val > 0 ? "+" : ""}${val}点</strong></div>`;
    }
    const opponentLabel = result === "ロン和了" ? "誰から？" : result === "ロン放銃" ? "誰へ？" : result === "ツモられ" ? "誰にツモられ？" : "";
    const pointLabel = result === "ツモ和了" ? "益田の総収入" : result === "ツモられ" ? "益田の支払い" : result === "ロン放銃" ? "失点" : "打点";
    const ready = isDraw ? (inputDraft.stance && inputDraft.tag) : ((!needsOpponent || inputDraft.opponent) && inputDraft.point && (inputDraft.isIrregularPoint || isPointAllowed(session, inputDraft.point)) && inputDraft.stance && inputDraft.tag);

        ${needsOpponent ? `<h3>${opponentLabel}</h3>${renderChoiceButtons(others, "selectOpponent", inputDraft.opponent)}` : ""}
        ${isDraw ? renderDrawSection(ps) : `<h3>${pointLabel}</h3>${renderPointButtons("point", session)}`}
        ${scorePreview}

          ${btn("保存", `saveInput()`, ready ? "primary" : "")}
          ${btn("戻る", `showRound('${session.id}')`)}
        </div>
      </section>`;
    if (!ready) {

  function renderDrawSection(ps) {
    return `<h3>テンパイ者を選択</h3><p class="muted">参加者3人から選択。全員テンパイ・全員ノーテンは点数移動0。</p><div class="grid three">${ps.map(p => btn(p, `toggleTenpai('${p}')`, (inputDraft.tenpaiPlayers || []).includes(p) ? "selected" : "")).join("")}</div>`;
  }
  function calcDrawDelta(tenpaiPlayers, ps) {
    const t = tenpaiPlayers || [];
    const n = t.length;
    if (n === 0 || n === ps.length) return 0;
    const masudaT = t.includes("益田");
    if (n === 1) return masudaT ? 2000 : -1000;
    if (n === 2) return masudaT ? 1000 : -2000;
    return 0;
  }

  window.saveInput = function() {
    const session = sessions().find(s => s.id === inputDraft.sessionId);
    if (!session) return showHome();
    const log = baseLog(session, inputDraft.resultType);
    log.opponent = inputDraft.opponent || "";
    log.stance = inputDraft.stance || "";
    log.subjectiveTag = inputDraft.tag || "";
    log.tenpaiPlayers = inputDraft.tenpaiPlayers || [];
    if (inputDraft.resultType === "流局") {
      log.scoreDeltaPoint = calcDrawDelta(log.tenpaiPlayers, participants(session));
    } else {
      const sign = (inputDraft.resultType === "ロン放銃" || inputDraft.resultType === "ツモられ") ? -1 : 1;
      log.scoreDeltaPoint = sign * inputDraft.point;
    }
    log.scoreDeltaK = log.scoreDeltaPoint / 1000;
    log.masudaDealer = isMasudaDealer(session);
    log.opponentDealer = log.opponent ? currentRoles(session).east === log.opponent : false;
    addLog(log);
    renderNextStep(session.id, "保存しました。次局処理を選択してください。");
  };

  window.saveSkip = function(sessionId, reason) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    const log = baseLog(session, "スキップ");
    log.skipReason = reason;
    addLog(log);
    renderNextStep(sessionId, `${reason}として記録しました。`);
  };

  window.saveNoDamage = function(sessionId) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    const log = baseLog(session, "被害なし");
    log.scoreDeltaPoint = 0;
    log.scoreDeltaK = 0;
    log.stance = "";
    log.subjectiveTag = "";
    addLog(log);
    renderNextStep(sessionId, "被害なしとして記録しました。");
  };

  window.undoLastRound = function(sessionId) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    if (session.status !== "in_progress") {
      alert("終了済みの半荘では、直前局へ戻る機能は使用できません。");
      return;
    }
    const last = lastActiveLog(sessionId);
    if (!last) {
      alert("取り消せる直前ログがありません。");
      return;
    }
    if (!last.currentSnapshot) {
      alert("この直前ログには復元情報がありません。v1.7.0以降に保存した局から使用できます。");
      return;
    }
    const msg = `直前の局ログを取消済みにし、この局へ戻ります。\n\n対象：${last.roundLabel || ""} / ${last.resultType || ""} / ${formatDelta(last.scoreDeltaPoint)}\n\nこの操作は通常CSVには反映されません。よろしいですか？`;
    if (!confirm(msg)) return;

    const allLogs = logs();
    const idx = allLogs.findIndex(l => l.id === last.id);
    if (idx >= 0) {
      allLogs[idx] = {
        ...allLogs[idx],
        isCanceled: true,
        canceledAt: nowText(),
        cancelReason: "直前局へ戻る"
      };
      setLogs(allLogs);
    }

    const allSessions = sessions();
    const sidx = allSessions.findIndex(s => s.id === sessionId);
    if (sidx >= 0) {
      allSessions[sidx].current = {
        field: last.currentSnapshot.field,
        roundNumber: Number(last.currentSnapshot.roundNumber || 1),
        repeatCount: Number(last.currentSnapshot.repeatCount || 0),
        dealerIndex: Number(last.currentSnapshot.dealerIndex || 0)
      };
      allSessions[sidx].updatedAt = nowText();
      setSessions(allSessions);
    }
    showRound(sessionId);
  };

  function renderNextStep(sessionId, message) {
    const session = sessions().find(s => s.id === sessionId);
    app.innerHTML = `<section class="card"><h2>${esc(message)}</h2><p>${esc(roundLabel(session))}</p><div class="grid two">${btn("親継続", `continueDealer('${sessionId}')`, "accent")}${btn("親流れ", `rotateDealer('${sessionId}')`, "primary")}</div></section>`;
  }

  window.continueDealer = function(sessionId) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    session.current.repeatCount += 1;
    updateSession(session);
    showRound(sessionId);
  };

  window.rotateDealer = function(sessionId) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    if (session.current.field === "南場" && session.current.roundNumber === 4) {
      session.status = "completed";
      updateSession(session);
      showScoreInput(sessionId, true);
      return;
    }
    session.current.dealerIndex = (session.current.dealerIndex + 1) % 4;
    session.current.repeatCount = 0;
    if (session.current.field === "東場" && session.current.roundNumber === 4) {
      session.current.field = "南場";
      session.current.roundNumber = 1;
    } else {
      session.current.roundNumber += 1;
    }
    updateSession(session);
    showRound(sessionId);
  };

  window.finishSession = function(sessionId) {
    if (!confirm("この半荘を終了しますか？")) return;
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return;
    session.status = "completed";
    updateSession(session);
    showScoreInput(sessionId, true);
  };

  window.showScoreInput = function(sessionId, justFinished=false) {
    const session = sessions().find(s => s.id === sessionId);
    if (!session) return showHome();
    let tempK = session.masudaScoreK ?? 0;
    window.adjustScore = function(delta) { tempK += delta; renderScoreInput(); };
    window.clearScore = function() { tempK = 0; renderScoreInput(); };
    window.saveScore = function() {
      const all = sessions();
      const idx = all.findIndex(s => s.id === sessionId);
      if (idx >= 0) {
        all[idx].masudaScoreK = tempK;
        all[idx].masudaScorePoint = tempK * 1000;
        all[idx].memo = document.getElementById("scoreMemo")?.value || "";
        all[idx].updatedAt = nowText();
        setSessions(all);
      }
      showSessionList();
    };
    function renderScoreInput() {
      app.innerHTML = `
        <section class="card">
          <h2>${justFinished ? "半荘終了" : "半荘収支入力"}</h2>
          <p>${esc(session.sessionLabel || session.date)} / 開始 東:${esc(session.initialSeats.east)} 南:${esc(session.initialSeats.south)} 西:${esc(session.initialSeats.west)} 北:${esc(session.initialSeats.north)}</p>
          <p class="muted">収支は1000点単位で入力します。</p>
          <div class="big-number ${tempK >= 0 ? "score-pos" : "score-neg"}">${tempK >= 0 ? "+" : ""}${tempK} <span class="muted">= ${tempK*1000}点</span></div>
          <div class="grid four">
            ${btn("+1", "adjustScore(1)")}${btn("+5", "adjustScore(5)")}${btn("+10", "adjustScore(10)")}${btn("+20", "adjustScore(20)")}
            ${btn("-1", "adjustScore(-1)")}${btn("-5", "adjustScore(-5)")}${btn("-10", "adjustScore(-10)")}${btn("-20", "adjustScore(-20)")}
          </div>
          <p>${btn("クリア", "clearScore()", "soft")}</p>
          <h3>半荘メモ</h3><textarea id="scoreMemo">${esc(session.memo || "")}</textarea>
          <div class="row" style="margin-top:14px;">${btn("保存", "saveScore()", "primary")}${btn("後で入力", "showSessionList()")}</div>
        </section>`;
    }
    renderScoreInput();
  };

  window.showSessionList = function() {
    const ss = sessions().slice().reverse();
    app.innerHTML = `<section class="card"><h2>半荘一覧</h2>${ss.length ? `<table><thead><tr><th>半荘</th><th>席順</th><th>収支</th><th>状態</th><th></th></tr></thead><tbody>${ss.map(s => `<tr><td>${esc(s.sessionLabel || s.date)}</td><td>東:${esc(s.initialSeats.east)}<br>南:${esc(s.initialSeats.south)}<br>西:${esc(s.initialSeats.west)}<br>北:${esc(s.initialSeats.north)}</td><td>${s.masudaScoreK == null ? "未入力" : `${s.masudaScoreK >= 0 ? "+" : ""}${s.masudaScoreK}`}</td><td>${esc(s.status)}</td><td>${s.status === "in_progress" ? btn("開く", `showRound('${s.id}')`) : btn("収支", `showScoreInput('${s.id}')`)} ${btn("削除", `deleteSession('${s.id}')`, "danger")}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">まだ半荘がありません。</p>`}</section>`;
  };

  window.deleteSession = function(sessionId) {
    if (!confirm("この半荘と紐づく局ログを削除しますか？")) return;
    setSessions(sessions().filter(s => s.id !== sessionId));
    setLogs(logs().filter(l => l.sessionId !== sessionId));
    showSessionList();
  };

  window.showLogList = function() {
    const ls = logs().filter(l => l.isCanceled !== true).slice().reverse();
    app.innerHTML = `<section class="card"><h2>局ログ一覧</h2><p class="muted">取消済みログはこの一覧には表示しません。</p>${ls.length ? `<table><thead><tr><th>局</th><th>結果</th><th>点数</th><th>姿勢/タグ</th><th></th></tr></thead><tbody>${ls.map(l => `<tr><td>${esc(l.date)}<br>${esc(l.roundLabel)}<br>親:${esc(l.dealer)} 北:${esc(l.northPlayer)}</td><td>${esc(l.resultType)}<br>${esc(l.opponent || l.skipReason || "")}</td><td>${l.scoreDeltaPoint > 0 ? "+" : ""}${l.scoreDeltaPoint}</td><td>${esc(l.stance || "")}<br>${esc(l.subjectiveTag || "")}</td><td>${btn("削除", `deleteLog('${l.id}')`, "danger")}</td></tr>`).join("")}</tbody></table>` : `<p class="muted">まだ局ログがありません。</p>`}</section>`;
  };
  window.deleteLog = function(logId) { setLogs(logs().filter(l => l.id !== logId)); showLogList(); };

  function csvEscape(v) {
    const s = Array.isArray(v) ? v.join("・") : String(v ?? "");
    if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
    return s;
  }
  function downloadCsv(filename, rows) {
    const csv = "\uFEFF" + rows.map(row => row.map(csvEscape).join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  window.exportLogsCsv = function() {
    const header = ["半荘ID","局ID","日付","局表示","場","局番号","連荘数","親","北家","参加者","益田参加","スキップ理由","結果","相手","点数移動_点","点数移動_千点","益田親","相手親","対局姿勢","主観タグ","テンパイ者","作成日時"];
    const rows = logs().filter(l => l.isCanceled !== true).map(l => [l.sessionId,l.id,l.date,l.roundLabel,l.field,l.roundNumber,l.repeatCount,l.dealer,l.northPlayer,l.participants,l.masudaJoined,l.skipReason,l.resultType,l.opponent,l.scoreDeltaPoint,l.scoreDeltaK,l.masudaDealer,l.opponentDealer,l.stance,l.subjectiveTag,l.tenpaiPlayers,l.createdAt]);
    downloadCsv(`sanma_round_logs_${today()}.csv`, [header, ...rows]);
  };
  window.exportSessionsCsv = function() {
    const header = ["半荘ID","日付","半荘No","半荘ラベル","開始東家","開始南家","開始西家","開始北家","益田収支_点","益田収支_千点","半荘メモ","状態","作成日時","更新日時"];
    const rows = sessions().map(s => [s.id,s.date,s.sessionNo ?? "",s.sessionLabel ?? "",s.initialSeats.east,s.initialSeats.south,s.initialSeats.west,s.initialSeats.north,s.masudaScorePoint ?? "",s.masudaScoreK ?? "",s.memo ?? "",s.status,s.createdAt,s.updatedAt]);
    downloadCsv(`sanma_sessions_${today()}.csv`, [header, ...rows]);
  };
  window.showCsv = function() {
    app.innerHTML = `<section class="card"><h2>CSV出力</h2><p class="muted">局ログCSVと半荘CSVを別々に出力します。取消済みログは通常CSVから除外します。</p><div class="grid two">${btn("局ログCSVを出力", "exportLogsCsv()", "primary")}${btn("半荘CSVを出力", "exportSessionsCsv()", "primary")}</div></section><section class="card"><h2>現在の件数</h2><p>局ログ：${logs().filter(l => l.isCanceled !== true).length}件（取消済み除外）</p><p>取消済みログ：${logs().filter(l => l.isCanceled === true).length}件</p><p>半荘：${sessions().length}件</p></section>`;
  };



  window.showAppUpdate = async function() {
    let latest = null;
    let checkedAt = nowText();
    let errorText = "";
    try {
      const res = await fetch(`./version.json?ts=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`version.json を取得できませんでした: ${res.status}`);
      latest = await res.json();
    } catch (e) {
      errorText = String(e.message || e);
    }

    const latestVersion = latest?.appVersion || "";
    const needsUpdate = latestVersion && latestVersion !== APP_VERSION;

    app.innerHTML = `
      <section class="card">
        <h2>アプリ更新</h2>
        <p class="muted">GitHub Pages上にアップロード済みの最新版を、この端末で読み直すための画面です。</p>
        <div class="updateBox">
          <p><strong>現在の版：</strong><span class="mono">v${esc(APP_VERSION)}</span></p>
          <p><strong>公開中の版：</strong>${latestVersion ? `<span class="mono">v${esc(latestVersion)}</span>` : `<span class="muted">確認できません</span>`}</p>
          <p><strong>確認時刻：</strong>${esc(checkedAt)}</p>
          ${errorText ? `<div class="statusWarn"><strong>確認失敗</strong><br>${esc(errorText)}<br>GitHub上に version.json があるか確認してください。</div>` : ""}
          ${latestVersion ? (needsUpdate ? `<div class="statusWarn"><strong>更新があります。</strong><br>下のボタンでキャッシュ回避付きで再読み込みします。</div>` : `<div class="statusOk">この端末で表示中のアプリ本体は、公開中の版と一致しています。</div>`) : ""}
        </div>
      </section>

      <section class="card">
        <h2>更新操作</h2>
        <div class="grid two">
          ${btn("最新版を読み直す", "forceAppReload()", "primary")}
          ${btn("システムへ", "showSystem()")}
        </div>
        <p class="muted">この操作は、GitHubにファイルをアップロードする機能ではありません。GitHub上の index.html 等を更新済みの場合に、この端末で最新版を読み直します。</p>
      </section>

      <section class="card">
        <h2>使い分け</h2>
        <div class="resumeBlock">
          <ul>
            <li><strong>アプリ更新：</strong>GitHub Pages上の新しい index.html をこの端末で読み直す。</li>
            <li><strong>保存データ形式補正：</strong>端末内のlocalStorageにある過去データの不足項目を補正する。</li>
          </ul>
        </div>
      </section>
    `;
  };

  window.forceAppReload = function() {
    const url = new URL(window.location.href);
    url.searchParams.set("reload", Date.now().toString());
    window.location.href = url.toString();
  };

  window.showSystem = function() {
    const st = settings();
    const ss = sessions();
    const ls = logs();
    const backupKeys = [];
    for (let i=0; i<localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(KEY_BACKUP_PREFIX)) backupKeys.push(k);
    }
    app.innerHTML = `
      <section class="card">
        <h2>システム</h2>
        <div class="versionBox">
          <p><strong>アプリバージョン：</strong><span class="mono">${esc(APP_VERSION)}</span></p>
          <p><strong>データ形式：</strong><span class="mono">schema v${esc(DATA_SCHEMA_VERSION)}</span></p>
          <p><strong>現在の保存データ形式：</strong><span class="mono">schema v${esc(st.dataSchemaVersion || "未設定")}</span></p>
          <p><strong>最終データ更新：</strong>${esc(st.lastMigrationAt || "未実行")}</p>
          <p><strong>半荘データ：</strong>${ss.length}件　<strong>局ログ：</strong>${ls.filter(l => l.isCanceled !== true).length}件　<strong>取消済み：</strong>${ls.filter(l => l.isCanceled === true).length}件</p>
          <p><strong>バックアップ：</strong>${backupKeys.length}件</p>
        </div>
        ${schemaStatusHtml()}
      </section>
      <section class="card">
        <h2>保存データ形式補正</h2>
        <p class="muted">保存済みの半荘データ・局ログについて、不足項目を現在のデータ形式に合わせて補正します。アプリ本体を更新する機能ではありません。保存キーは変更せず、既存データを消去しません。</p>
        <div class="warnBox">
          <p><strong>実行前に自動バックアップを作成します。</strong></p>
          <p class="muted">過去データの削除や localStorage.clear() は行いません。</p>
        </div>
        <div class="grid two">
          ${btn("保存データ形式を現在形式に補正", "runDataMigration()", "primary")}
          ${btn("CSV出力へ", "showCsv()")}
        </div>
      </section>
      <section class="card">
        <h2>現在の保存キー</h2>
        <p class="mono">${esc(KEY_SESSIONS)}</p>
        <p class="mono">${esc(KEY_LOGS)}</p>
        <p class="mono">${esc(KEY_SETTINGS)}</p>
        <p class="mono">${esc(KEY_DRAFT)}</p>
      </section>
    `;
  };

  window.runDataMigration = function() {
    if (!confirm("保存済みデータの形式だけを補正します。アプリ本体のバージョン更新ではありません。実行前に自動バックアップを作成します。よろしいですか？")) return;
    const result = migrateData({silent:false});
    alert(`保存データ形式補正完了\n半荘：${result.sessionsBefore}件 → ${result.sessionsAfter}件\n局ログ：${result.logsBefore}件 → ${result.logsAfter}件`);
    showSystem();
  };


  ensureCurrentSchema();
  showHome();
})();
</script>
</div>
</body>
</html>
